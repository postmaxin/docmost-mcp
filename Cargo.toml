[package]
name = "docmost-mcp"
version = "1.0.0"
edition = "2024"
description = "Hardened Docmost MCP server with authenticated Streamable HTTP"
license = "MIT"
repository = "https://github.com/Rahulk644/docmost-mcp"

[features]
default = []

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.103"
axum = "0.8.8"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["clock", "serde"] }
clap = { version = "4.5.48", features = ["derive", "env"] }
dirs = "6.0.0"
futures = "0.3.31"
hmac = "0.12.1"
keyring = "3.6.3"
once_cell = "1.21.3"
open = "5.3.2"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1.11.3"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rmcp = { version = "=3.5.1", features = ["transport-io", "client", "transport-streamable-http-server"] }
schemars = "1.0.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
subtle = "2.6.1"
tokio = { version = "1.47.1", features = ["full"] }
tower = "0.5.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["fmt"] }
url = "2.5.7"
urlencoding = "2.1.3"

[dev-dependencies]
tempfile = "3.23.0"
